version: '3.8'

services:
  unfazed-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unfazed-practice-management
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/unfazed
      - JWT_SECRET=unfazed_production_jwt_secret_2026_super_secure
      - RAZORPAY_KEY_ID=rzp_test_unfazedDemoKey
      - RAZORPAY_KEY_SECRET=rzp_test_secret_unfazedDemoSecret
      - CLIENT_URL=http://localhost:5000
      - NODE_ENV=production
    depends_on:
      - mongo
    volumes:
      - unfazed-uploads:/app/backend/uploads

  mongo:
    image: mongo:7.0
    container_name: unfazed-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - unfazed-mongo-data:/data/db

volumes:
  unfazed-uploads:
  unfazed-mongo-data:

services:
  - type: web
    name: unfazed-practice-management
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build:frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set to your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_unfazedDemoKey
      - key: RAZORPAY_KEY_SECRET
        value: rzp_test_secret_unfazedDemoSecret
